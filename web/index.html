<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Képgeneráló</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>AI Képgeneráló</h1>
      <div id="user-bar" hidden>
        <span id="user-email"></span>
        <button id="logout" class="secondary">Kijelentkezés</button>
      </div>
    </header>

    <p id="config-error" class="error" hidden>
      Hiányzik a beállítás: állítsd be a SUPABASE_URL és SUPABASE_ANON_KEY változókat a Netlify-on
      (lásd DEPLOY.md).
    </p>

    <!-- Bejelentkezés -->
    <section id="login-view" class="card" hidden>
      <h2>Bejelentkezés</h2>
      <form id="login-form">
        <label>E-mail
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>Jelszó
          <input type="password" id="password" autocomplete="current-password">
        </label>
        <div class="row">
          <button type="submit">Belépés</button>
          <button type="button" id="magic-link" class="secondary">Belépési link küldése e-mailben</button>
        </div>
      </form>
      <p class="hint">Fiókot csak az oldal gazdája hozhat létre.</p>
      <p id="login-msg" class="msg" role="status"></p>
    </section>

    <!-- Generálás -->
    <section id="app-view" hidden>
      <form id="gen-form" class="card">
        <label>Milyen képet szeretnél?
          <textarea id="prompt" rows="3" maxlength="2000" required
            placeholder="pl. egy piros macska a holdon, akvarell stílusban"></textarea>
        </label>
        <div class="row">
          <label>Képarány
            <select id="ratio">
              <option value="1:1">Négyzet (1:1)</option>
              <option value="16:9">Fekvő (16:9)</option>
              <option value="3:2">Fekvő (3:2)</option>
              <option value="9:16">Álló (9:16)</option>
              <option value="2:3">Álló (2:3)</option>
            </select>
          </label>
          <label class="grow">Ne legyen a képen (csak Stability AI)
            <input id="negative" maxlength="1000" placeholder="pl. szöveg, elmosódás">
          </label>
        </div>
        <button type="submit" id="gen-btn">Generálás</button>
        <p id="gen-msg" class="msg" role="status"></p>
      </form>

      <figure id="result" class="card" hidden>
        <img id="result-img" alt="">
        <figcaption>
          <span id="result-caption"></span>
          <a id="result-download">Letöltés</a>
        </figcaption>
      </figure>

      <h2>Korábbi képeim</h2>
      <p id="gallery-empty" class="hint" hidden>Még nincs generált képed.</p>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>
</body>
</html>
